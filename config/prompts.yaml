  - PVC (rótulos y letras en corte — varía por espesor y densidad)
  - Rotulación (microperforado, frosted, PVC, rótulos)
  - Instalación
  - Uniformes
  - Bordado (camisas y gorras)
  - Serigrafía de camisas (varía por camisa, colores y cantidad)
  - Tumblers

  Para estos productos: recopilar los detalles y explicar que el equipo prepara
  la cotización. Si el cliente presiona con "¿más o menos cuánto?", responder:
  "Prefiero no darte un número al azar — el equipo te da el precio exacto en breve 🙌"

